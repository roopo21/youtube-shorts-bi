[build]
  command = "npm run build && npm test"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."api"]
  included_files = ["public/admin.html", "public/admin.js", "public/admin.css", "public/coverage.html", "public/coverage.js"]
